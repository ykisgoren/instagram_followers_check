<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 20px;
      background-color: #1c1e21;
      color: #e4e6eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    h3 { margin-top: 0; color: #fff; font-size: 18px; }
    p { font-size: 13px; color: #b0b3b8; margin-bottom: 20px; }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <h3>IG Analysis Global 🌍</h3>
  <p>Go to your Instagram profile page and click start.</p>
  <button id="startBtn">START / BAŞLAT 🚀</button>
  <script src="popup.js"></script>
</body>
</html>
